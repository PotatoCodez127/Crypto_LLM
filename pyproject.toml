[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".env",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable standard errors (E), Pyflakes (F), and Isort import sorting (I)
select = ["E", "F", "I"]
# Ignore Line Too Long rules to prevent breaking long semantic prompts or raw text tables
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Protect initialization configurations from unused import cleanups
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]